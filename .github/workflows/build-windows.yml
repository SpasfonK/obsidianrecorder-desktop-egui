name: Build Windows (ObsidianRECORDER Desktop)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Tests Rust (cargo test)
    runs-on: windows-latest
    steps:
      - name: Récupération du dépôt
        uses: actions/checkout@v4

      - name: Installation de Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      # whisper-rs-sys (dépendance de whisper-rs) utilise bindgen pour
      # générer ses liaisons FFI vers whisper.cpp, ce qui nécessite
      # libclang. Les runners windows-latest ne l'exposent pas de façon
      # fiable par défaut : on installe une version connue de LLVM/Clang et
      # on pointe LIBCLANG_PATH dessus explicitement. Version 18.x choisie
      # volontairement (voir README, section « Limites connues » : un bug
      # récent affecte bindgen avec libclang ≥ 22).
      - name: Installation de LLVM/Clang (requis par bindgen pour whisper-rs-sys)
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "18.1"
          directory: ${{ runner.temp }}/llvm

      - name: Configuration de LIBCLANG_PATH
        run: echo "LIBCLANG_PATH=$((gcm clang).source -replace 'clang.exe')" >> $env:GITHUB_ENV

      # Zéro régression (méthode Gauntlet Loop) : le job de build ne se
      # déclenche que si toute la suite de tests passe à 100 %. Les tests
      # nécessitant le modèle Whisper (~574 Mo, non téléchargé ici) sont
      # `#[ignore]` par défaut et ne s'exécutent donc pas dans ce job.
      - name: Exécution des tests unitaires et d'intégration
        run: cargo test --all --verbose

  build:
    name: Build de l'exécutable Windows (portable, sans dépendance)
    needs: test
    runs-on: windows-latest
    steps:
      - name: Récupération du dépôt
        uses: actions/checkout@v4

      - name: Installation de Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Installation de LLVM/Clang (requis par bindgen pour whisper-rs-sys)
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "18.1"
          directory: ${{ runner.temp }}/llvm

      - name: Configuration de LIBCLANG_PATH
        run: echo "LIBCLANG_PATH=$((gcm clang).source -replace 'clang.exe')" >> $env:GITHUB_ENV

      # whisper.cpp est compilé depuis ses sources C++ et lié statiquement :
      # aucune étape Node/npm/Tauri CLI, aucun .dll supplémentaire à publier.
      - name: Build release
        run: cargo build --release --verbose

      - name: Publication du binaire portable
        uses: actions/upload-artifact@v4
        with:
          name: ObsidianRECORDER-Desktop-portable
          path: target/release/obsidianrecorder-desktop.exe
          if-no-files-found: error

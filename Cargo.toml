[package]
name = "obsidianrecorder-desktop"
version = "0.7.0"
edition = "2021"
description = "ObsidianRECORDER Desktop – enregistreur de mémos vocaux local, sans dépendance externe : capture audio encodée en vrai MP3 (16 kHz mono, optimisé pour la transcription par IA externe), VAD anti-silence, découpe automatique en plusieurs fichiers, raccourci clavier global, export Markdown vers un Vault Obsidian, dashboard avec lecture audio, icône System Tray, mini-overlay vu-mètre live, interface native egui"
authors = ["SpasfonK"]
license = "MIT"
rust-version = "1.77"

[lib]
name = "obsidianrecorder_lib"
crate-type = ["rlib"]
path = "src/lib.rs"

[[bin]]
name = "obsidianrecorder-desktop"
path = "src/main.rs"

[dependencies]
# Interface native (rendu OpenGL via `glow`, déjà présent avec n'importe quel
# pilote graphique Windows) : zéro WebView2, zéro Node/npm, zéro runtime à
# installer. Version épinglée en-deçà du récent renommage App::update →
# App::ui (voir README, section « Limites connues ») pour rester sur une
# surface d'API la mieux établie.
eframe = "0.28"
egui = "0.28"
image = { version = "0.25", default-features = false, features = ["png"] }

# Socle audio/hotkey (inchangé depuis l'itération précédente)
cpal = "0.15"
hound = "3.5"
global-hotkey = "0.7"

# Reconnaissance vocale hors ligne : liaisons Rust vers whisper.cpp, compilé
# et lié STATIQUEMENT dans le binaire (aucun .dll séparé à distribuer). Le
# modèle GGML, lui, reste un fichier externe téléchargé une fois — voir
# src/stt/model.rs et scripts/download-model.ps1. Nécessite un compilateur
# C++ et libclang (bindgen) au moment de la COMPILATION uniquement ;
# voir le CI et le README, section « Limites connues », pour le détail.
whisper-rs = "0.16"

thiserror = "1"
chrono = { version = "0.4", features = ["clock"] }

# Sélecteur de dossier natif (boîte de dialogue Windows standard, API COM
# déjà présente sur le système) : zéro dépendance supplémentaire à installer,
# cohérent avec le reste du projet.
rfd = "0.15"

# Écriture atomique des notes (voir vault::writer) : utilisé en production,
# pas seulement dans les tests, d'où sa présence ici plutôt qu'en
# dev-dependencies.
tempfile = "3"

# Réglages persistés (voir settings.rs) : un simple fichier JSON local,
# aucun impact runtime (compilé statiquement, comme tout le reste).
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Icône et menu System Tray. Même organisation (tauri-apps) et même design
# que global-hotkey : contrainte Send/thread principal identique, gérée de
# la même façon (voir app.rs::setup_tray_icon).
tray-icon = "0.20"

# Encodage MP3 réel à la volée (voir audio::encoder) : liaisons Rust vers
# libmp3lame (LAME), compilée et liée statiquement dans le binaire — aucune
# dépendance système à installer, aucun exécutable externe. Produit de vraies
# trames MP3 avec en-têtes valides (jamais un WAV renommé), en CBR, au débit
# adapté à la voix. Le WAV (PCM 16 bits) reste proposé en option via `hound`.
#
# Licence : LAME est sous LGPL-3.0 (voir README, section « Limites connues »).
mp3lame-encoder = "0.2"

# Décodage de fichiers audio externes (import/transcodage en MP3, voir
# audio::import) et lecture des enregistrements MP3 dans le dashboard (voir
# audio::playback) : MP3 et M4A/AAC, en 100 % Rust pur. Le WAV, lui, reste
# géré par `hound` (déjà présent). Épinglé sur la branche 0.5 : la 0.6
# réorganise l'API des codecs (voir README, section « Limites connues »).
symphonia = { version = "0.5.4", default-features = false, features = ["mp3", "isomp4", "aac"] }

# Empreinte disque/mémoire minimale (cahier des charges, section 2).
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
